name: Build Cricket Manager Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Extracting $z..."
            unzip -o "$z"
          done

      - name: Locate Android project directory
        id: project
        shell: bash
        run: |
          APP_GRADLE=$(find . -maxdepth 4 -path "*/app/build.gradle.kts" | head -n 1)
          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: Could not find app/build.gradle.kts. Please upload CricketManager-Android.zip to the repository."
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
          echo "Found Android project at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install SDK 35
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper is executable and ready
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10.2 --no-daemon
          fi
          ./gradlew --version

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK output path
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            find app/build/outputs -maxdepth 4 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Cricket Manager Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Manager-Debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print build failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "=== Gradle Build Failure Diagnostics ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version || true
          ls -la || true
          find . -maxdepth 3 -name "gradle-wrapper*" 2>/dev/null || true
          find . -maxdepth 5 -path "*/build/reports/*" 2>/dev/null || true
